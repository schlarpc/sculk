// Applied by every platforms/* project after its loader plugin.
//
// Compiles the shared core sources into this mod and embeds the relocated
// Rhino classes as part of the mod's own output, so the same classes are used
// in dev runs and in the shipped jar, with no jar-in-jar involved.

sourceSets.main.java.srcDir rootProject.file('core/src/main/java')

configurations {
    shadedRhino {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    shadedRhino project(path: ':libs:rhino', configuration: 'shaded')
    compileOnly project(path: ':libs:rhino', configuration: 'shaded')
}

def unpackRhino = tasks.register('unpackShadedRhino', Sync) {
    // Declared as an input so Gradle builds :libs:rhino:shadowJar first; the
    // lazy zipTree below would otherwise hide that dependency.
    inputs.files configurations.shadedRhino
    from { configurations.shadedRhino.collect { zipTree(it) } }
    exclude 'META-INF/MANIFEST.MF'
    into layout.buildDirectory.dir('shaded/rhino')
}
sourceSets.main.output.dir(layout.buildDirectory.dir('shaded/rhino'), builtBy: unpackRhino)

// Real mods from Modrinth, used by integration tests (-Psculk.integ).
repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

// -Psculk.integ adds each platform's integration test mods to dev runs.
ext.sculkInteg = providers.gradleProperty('sculk.integ').isPresent()
// -Psculk.integStress adds a larger set of popular mods with heavy networking
// on top (scripts/integ.py --stress).
ext.sculkIntegStress = providers.gradleProperty('sculk.integStress').isPresent()

// -Psculk.mods=slug:versionId,... adds more Modrinth mods to dev runs, for
// testing against a specific mod.
providers.gradleProperty('sculk.mods').getOrElse('').split(',').findAll { it }.each {
    dependencies.add('runtimeOnly', "maven.modrinth:${it.trim()}")
}

// sculk.* settings forwarded from Gradle properties to dev runs as system
// properties, for example -Psculk.eventLog=/tmp/events.jsonl or
// -Psculk.control=0 (control server on a free port; see scripts/sculkctl.py).
ext.sculkRunProperties = ['sculk.eventLog', 'sculk.scripts', 'sculk.control', 'sculk.controlFile', 'sculk.controlToken',
                          'sculk.controlEvents', 'sculk.controlFrameBytes']
        .findAll { providers.gradleProperty(it).isPresent() }
        .collectEntries { [(it): providers.gradleProperty(it).get()] }

// -Psculk.quickPlay=host:port makes runClient join that server on startup.
ext.sculkQuickPlay = providers.gradleProperty('sculk.quickPlay').getOrNull()

// The web UI, served by the control server from sculk/web/ (see web/ and the
// root project's webUi task).
def webDirOverride = providers.gradleProperty('sculk.webDir')
processResources {
    if (!webDirOverride.isPresent()) dependsOn rootProject.tasks.named('webUi')
    from(webDirOverride.isPresent() ? webDirOverride.get() : rootProject.layout.buildDirectory.dir('web-ui')) {
        into 'sculk/web'
        // Files from the Nix store are read-only; keep the copies writable so
        // later builds can replace them.
        filePermissions { unix('rw-r--r--') }
        dirPermissions { unix('rwxr-xr-x') }
    }
}
