# Builds every platform's jar on every push and pull request. A push to main
# also replaces the "nightly" prerelease with its jars; a v* tag publishes
# them as a real release. Pull requests and manual runs only build (the jars
# are the run's artifacts).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The loader-agnostic engine's unit tests. Platforms compile core's sources
  # into themselves rather than depending on :core, so their builds skip these.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-core-${{ hashFiles('**/*.gradle', 'gradle.properties', 'platforms/*/gradle.properties') }}
          restore-keys: gradle-core-
      - run: nix develop -c gradle :core:test

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - neoforge-1.21.1
          - fabric-1.21.1
          - fabric-26.3
          - neoforge-26.3
          - forge-1.20.1
          - forge-1.18.2
          - forge-1.19.2
    steps:
      # The jar version comes from git (0.1.0+<rev>), so this must be a
      # checkout of the commit, and the tree must stay clean (no .dirty).
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Minecraft, mappings and loader downloads are large; keep them per platform.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.platform }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'platforms/*/gradle.properties') }}
          restore-keys: gradle-${{ matrix.platform }}-
      - run: nix develop -c gradle :platforms:${{ matrix.platform }}:build
      # build/libs holds the shippable jar: Loom's remapJar output for Fabric,
      # the reobfuscated jar for Forge. Dev jars go to build/devlibs instead.
      - name: Check the jar
        run: |
          shopt -s nullglob
          jars=(platforms/${{ matrix.platform }}/build/libs/sculk-*.jar)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "::error::expected one jar in build/libs, found: ${jars[*]:-none}"
            exit 1
          fi
          case "${jars[0]}" in
            *.dirty.jar) echo "::error::${jars[0]} was built from a dirty tree:"; git status --porcelain; exit 1 ;;
          esac
          echo "${jars[0]}"
      - uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.platform }}
          path: platforms/${{ matrix.platform }}/build/libs/sculk-*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The jars carry mod_version, so a tag that disagrees would publish
      # jars named for another version.
      - name: Check the tag matches mod_version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mod_version=$version in gradle.properties (expected v$version)"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: jar-*
          path: jars
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" jars/*.jar --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  # A rolling prerelease of main: deleted and made again at this commit, so
  # it holds only the newest jars and never shows as the latest release.
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two pushes in quick succession must not interleave delete and create.
    concurrency:
      group: nightly
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: jar-*
          path: jars
          merge-multiple: true
      - name: Replace the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly jars/*.jar --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Nightly (${GITHUB_SHA::7})" \
            --notes "Built from main at $GITHUB_SHA. Replaced on every push; for a stable build, use a versioned release."
