// Loader plugins are declared once here (and not applied) so every subproject
// shares a single plugin classloader. Each platform applies the one it needs.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
    id 'net.neoforged.moddev.legacyforge' version "${moddev_version}" apply false
    id 'com.gradleup.shadow' version "${shadow_version}" apply false
}

// The version every jar carries: mod_version plus the commit as build
// metadata (0.1.0+1a2b3c4), and .dirty when the tree has changes git would
// commit or untracked files it does not ignore. Outside a git checkout, mod_version alone.
def git = { List<String> args ->
    try {
        def r = providers.exec {
            commandLine(['git', '-C', rootDir.path] + args)
            ignoreExitValue = true
        }
        r.result.get().exitValue == 0 ? r.standardOutput.asText.get().trim() : null
    } catch (Exception ignored) {
        null // no git
    }
}
def rev = git(['rev-parse', '--short=7', 'HEAD'])
ext.sculk_version = rev ? "${mod_version}+${rev}${git(['status', '--porcelain']) ? '.dirty' : ''}" : mod_version

subprojects {
    group = 'sculk'
    version = rootProject.sculk_version

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// The control server's web UI (web/), built by Nix: `nix build .#web`. Each
// platform packs the result into its jar under sculk/web/. Flakes see only
// files git knows about, so `git add` new files under web/ before building.
// -Psculk.webDir=<dir> uses an already built UI instead of running Nix.
tasks.register('webUi', Exec) {
    description = 'Builds the web UI with Nix into build/web-ui.'
    workingDir = rootDir
    inputs.dir('web')
    inputs.files('flake.nix', 'flake.lock')
    outputs.upToDateWhen { false } // Nix does its own caching, and the out-link is a symlink.
    commandLine 'nix', '--extra-experimental-features', 'nix-command flakes',
            'build', '.#web', '--out-link', 'build/web-ui'
}

// @babel/standalone for the script transpiler (nix/babel): `nix build .#babel`.
// Each platform packs it into its jar under sculk/babel/, and core's tests
// get it on their classpath. -Psculk.babelDir=<dir> uses a copy already at hand.
tasks.register('babel', Exec) {
    description = 'Fetches @babel/standalone with Nix into build/babel.'
    workingDir = rootDir
    inputs.files('nix/babel/default.nix', 'nix/babel/package.json', 'nix/babel/package-lock.json', 'flake.nix', 'flake.lock')
    outputs.upToDateWhen { false } // Nix does its own caching, and the out-link is a symlink.
    commandLine 'nix', '--extra-experimental-features', 'nix-command flakes',
            'build', '.#babel', '--out-link', 'build/babel'
}
ext.babelDir = providers.gradleProperty('sculk.babelDir')

// The Nostr relay list for remote access, from the pinned shell repo
// (sculk-ui): `nix build .#relays`. Each platform packs it under
// sculk/remote/ as the fallback for the copy the mod fetches from
// https://sculk-ui.github.io/relays.json (docs/REMOTE.md), and core's tests
// get it on their classpath. -Psculk.relaysDir=<dir> uses a copy at hand.
tasks.register('relays', Exec) {
    description = 'Fetches the remote access relay list with Nix into build/relays.'
    workingDir = rootDir
    inputs.files('flake.nix', 'flake.lock')
    outputs.upToDateWhen { false } // Nix does its own caching, and the out-link is a symlink.
    commandLine 'nix', '--extra-experimental-features', 'nix-command flakes',
            'build', '.#relays', '--out-link', 'build/relays'
}
ext.relaysDir = providers.gradleProperty('sculk.relaysDir')
