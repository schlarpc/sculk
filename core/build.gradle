// sculk-core: the loader- and version-agnostic engine.
//
// Rules for this module:
//   * No Minecraft, Mixin, or mod-loader classes. Ever.
//   * Netty, SLF4J, Gson and Brigadier are compileOnly: every supported Minecraft version
//     ships them, so the game provides them at runtime. Pin the oldest version
//     any target ships so we never compile against newer APIs.
//   * Bytecode targets Java 17, the oldest JVM any platform runs on (1.20.1).
//
// Platforms compile these sources straight into their own mod jar (see
// platforms/*/build.gradle), so this project's jar is only used for tests.
plugins {
    id 'java-library'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Mojang'; url = 'https://libraries.minecraft.net' } }
        filter { includeModule 'com.mojang', 'brigadier' }
    }
}

dependencies {
    compileOnlyApi 'io.netty:netty-transport:4.1.97.Final'
    compileOnlyApi 'org.slf4j:slf4j-api:2.0.9'
    compileOnlyApi 'com.google.code.gson:gson:2.10.1'
    compileOnlyApi 'com.mojang:brigadier:1.1.8'
    // Relocated Rhino (sculk.shaded.org.mozilla); see libs/rhino.
    api project(path: ':libs:rhino', configuration: 'shaded')
    // Relocated zstd (sculk.shaded.io.airlift.compress); see libs/aircompressor.
    api project(path: ':libs:aircompressor', configuration: 'shaded')
    // Relocated Chicory (sculk.shaded.com.dylibso.chicory), and the remote
    // access WebRTC module compiled for it; see libs/chicory, libs/webrtc.
    api project(path: ':libs:chicory', configuration: 'shaded')
    api project(path: ':libs:webrtc', configuration: 'shaded')

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.netty:netty-transport:4.1.97.Final'
    testImplementation 'io.netty:netty-codec:4.1.97.Final'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.mojang:brigadier:1.1.8'
    testImplementation 'com.google.guava:guava:32.1.2-jre'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
}

test {
    useJUnitPlatform()
}

// Babel on the test classpath under sculk/babel/, as in the mod jars.
processTestResources {
    if (!rootProject.babelDir.isPresent()) dependsOn rootProject.tasks.named('babel')
    from(rootProject.babelDir.isPresent() ? rootProject.babelDir.get() : rootProject.layout.buildDirectory.dir('babel')) {
        into 'sculk/babel'
        filePermissions { unix('rw-r--r--') }
        dirPermissions { unix('rwxr-xr-x') }
    }
    // The relay list under sculk/remote/, as in the mod jars.
    if (!rootProject.relaysDir.isPresent()) dependsOn rootProject.tasks.named('relays')
    from(rootProject.relaysDir.isPresent() ? rootProject.relaysDir.get() : rootProject.layout.buildDirectory.dir('relays')) {
        include 'relays.json'
        into 'sculk/remote'
        filePermissions { unix('rw-r--r--') }
    }
}
