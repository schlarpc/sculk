pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'sculk'

// Loader-agnostic engine. Must never depend on Minecraft or a mod loader.
include 'core'

// One subproject per (loader, Minecraft version) target. See docs/ARCHITECTURE.md.
include 'platforms:neoforge-1.21.1'
include 'platforms:fabric-26.3'
include 'platforms:forge-1.20.1'
