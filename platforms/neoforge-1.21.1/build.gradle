// NeoForge 1.21.1 (protocol era C, Mojang names at runtime, Java 21).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base.archivesName = "${mod_id}-neoforge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

apply from: rootProject.file('gradle/platform-common.gradle')

neoForge {
    version = neo_version
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            if (sculkQuickPlay) programArguments.addAll('--quickPlayMultiplayer', sculkQuickPlay, '--width', '640', '--height', '360')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
        }
        configureEach {
            sculkRunProperties.each { k, v -> systemProperty k, v }
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    if (sculkInteg) {
        // Integration test mods (Modrinth version ids). See tests/integ/.
        runtimeOnly 'maven.modrinth:appleskin:uAKA6Laj'  // 3.0.9+mc1.21
        runtimeOnly 'maven.modrinth:balm:gMedgtzL'       // 21.0.67+neoforge-1.21.1
        runtimeOnly 'maven.modrinth:waystones:6Z6MQ6os'  // 21.1.46+neoforge-1.21.1
    }
    if (sculkIntegStress) {
        runtimeOnly 'maven.modrinth:create:UjX6dr61'                  // 6.0.10+mc1.21.1
        runtimeOnly 'maven.modrinth:ae2:DxZ2waV0'                     // 19.2.19
        runtimeOnly 'maven.modrinth:guideme:QeYKsstN'                 // 21.1.22 (AE2 dependency)
        runtimeOnly 'maven.modrinth:sophisticated-backpacks:tJnK2DE1' // 1.21.1-3.26.21.2249
        runtimeOnly 'maven.modrinth:sophisticated-core:FilyXPLY'      // 1.21.1-1.5.35.2473
        runtimeOnly 'maven.modrinth:jei:iv3KiVkE'                     // 19.64.0.455
        runtimeOnly 'maven.modrinth:mezzconfig:V6oWFnxW'              // 0.7.1 (JEI dependency)
        runtimeOnly 'maven.modrinth:jade:eYz2YBGT'                    // 15.10.6+neoforge
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_description        : mod_description,
    ]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
