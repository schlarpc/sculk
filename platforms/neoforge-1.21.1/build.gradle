// NeoForge 1.21.1 (protocol era C, Mojang names at runtime, Java 21).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base.archivesName = "${mod_id}-neoforge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

apply from: rootProject.file('gradle/platform-common.gradle')

neoForge {
    version = neo_version
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            if (sculkQuickPlay) programArguments.addAll('--quickPlayMultiplayer', sculkQuickPlay, '--width', '640', '--height', '360')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
        }
        configureEach {
            sculkRunProperties.each { k, v -> systemProperty k, v }
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    if (sculkInteg) {
        // Integration test mods (Modrinth version ids). See tests/integ/.
        runtimeOnly 'maven.modrinth:appleskin:uAKA6Laj'  // 3.0.9+mc1.21
        runtimeOnly 'maven.modrinth:balm:gMedgtzL'       // 21.0.67+neoforge-1.21.1
        runtimeOnly 'maven.modrinth:waystones:6Z6MQ6os'  // 21.1.46+neoforge-1.21.1
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_description        : mod_description,
    ]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
