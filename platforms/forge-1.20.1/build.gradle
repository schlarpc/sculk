// Forge 1.20.1 (protocol era A, SRG member names at runtime, Java 17).
// MDG Legacy compiles against Mojang names and reobfuscates the jar to SRG;
// the mixin annotation processor writes a refmap so injections resolve too.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge'
}

base.archivesName = "${mod_id}-forge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

apply from: rootProject.file('gradle/platform-common.gradle')

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            if (sculkQuickPlay) programArguments.addAll('--quickPlayMultiplayer', sculkQuickPlay, '--width', '640', '--height', '360')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
        }
        configureEach {
            sculkRunProperties.each { k, v -> systemProperty k, v }
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    if (sculkInteg) {
        // Integration test mods (Modrinth version ids), remapped from SRG to
        // dev names by MDG Legacy. See tests/integ/.
        modRuntimeOnly 'maven.modrinth:appleskin:XdXDExVF'  // 2.5.1+mc1.20.1
        modRuntimeOnly 'maven.modrinth:balm:dDN38ae7'       // 7.3.44+forge-1.20.1
        modRuntimeOnly 'maven.modrinth:waystones:Y0IgdaoP'  // 14.1.21+forge-1.20.1
    }
}

jar {
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [
        minecraft_version_range: minecraft_version_range,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_description        : mod_description,
    ]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata
