// Fabric 26.3 (protocol era C, unobfuscated, Java 25). Uses the
// non-remapping Loom plugin: 26.x ships without obfuscation, so there is no
// intermediary and no mappings line.
plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

base.archivesName = "${mod_id}-fabric-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

apply from: rootProject.file('gradle/platform-common.gradle')

loom {
    runs {
        client {
            runDir = 'run/client'
            if (sculkQuickPlay) programArgs '--quickPlayMultiplayer', sculkQuickPlay, '--width', '640', '--height', '360'
        }
        server {
            runDir = 'run/server'
        }
        configureEach {
            sculkRunProperties.each { k, v -> property k, v }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    if (sculkInteg) {
        // Integration test mods (Modrinth version ids). See tests/integ/.
        runtimeOnly 'maven.modrinth:appleskin:PHjDtQay'  // 3.0.10+mc26.3
        runtimeOnly 'maven.modrinth:balm:MYj31XNG'       // 26.3.0.3+fabric-26.3
        runtimeOnly 'maven.modrinth:shogi:9gkJoFhj'      // 26.3.0.3+fabric-26.3 (Waystones dependency)
        runtimeOnly 'maven.modrinth:waystones:FHxw949T'  // 26.3.0.2+fabric-26.3
    }
}

processResources {
    var props = [
        version         : mod_version,
        mod_id          : mod_id,
        mod_name        : mod_name,
        mod_license     : mod_license,
        mod_description : mod_description,
        minecraft_version: minecraft_version,
        loader_version  : fabric_loader_version,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}
