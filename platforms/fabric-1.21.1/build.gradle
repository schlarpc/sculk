// Fabric 1.21.1 (protocol era C, intermediary names at runtime, Java 21).
// Uses the remapping Loom plugin: sources and dev runs use Mojang names,
// and the built jar is remapped to intermediary.
plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom-remap'
}

base.archivesName = "${mod_id}-fabric-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

apply from: rootProject.file('gradle/platform-common.gradle')

// The integration test mod (sculktest): shared payloads and logic from
// platforms/shared, Fabric glue from src/testmod. Always compiled, loaded in
// dev runs only with -Psculk.integ.
sourceSets {
    testmod {
        java.srcDirs = ['src/testmod/java', rootProject.file("platforms/shared/mc-${shared_mc}/testmod/java")]
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

loom {
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        if (sculkInteg) sculktest { sourceSet sourceSets.testmod }
    }
    runs {
        client {
            runDir = 'run/client'
            if (sculkQuickPlay) programArgs '--quickPlayMultiplayer', sculkQuickPlay, '--width', '640', '--height', '360'
        }
        server {
            runDir = 'run/server'
        }
        configureEach {
            sculkRunProperties.each { k, v -> property k, v }
            if (sculkRunJvmArgs) vmArgs(*sculkRunJvmArgs)
            if (sculkInteg) source sourceSets.testmod
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    if (sculkInteg) {
        // Integration test mods (Modrinth version ids), remapped to Mojang
        // names by Loom. See tests/integ/.
        modRuntimeOnly 'maven.modrinth:appleskin:b5ZiCjAr'     // 3.0.6+mc1.21
        modRuntimeOnly 'maven.modrinth:cloth-config:HpMb5wGb'  // 15.0.140+fabric (AppleSkin's client config)
        modRuntimeOnly 'maven.modrinth:balm:HY6fKMHC'       // 21.0.67+fabric-1.21.1
        modRuntimeOnly 'maven.modrinth:waystones:nSAwjAk4'  // 21.1.46+fabric-1.21.1
    }
}

processResources {
    var props = [
        version         : mod_version,
        mod_id          : mod_id,
        mod_name        : mod_name,
        mod_license     : mod_license,
        mod_description : mod_description,
        minecraft_version: minecraft_version,
        loader_version  : fabric_loader_version,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}
