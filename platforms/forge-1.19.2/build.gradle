// Forge 1.19.2 (protocol era A, SRG member names at runtime, Java 17).
// MDG Legacy compiles against Mojang names and reobfuscates the jar to SRG;
// the mixin annotation processor writes a refmap so injections resolve too.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge'
}

base.archivesName = "${mod_id}-forge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

apply from: rootProject.file('gradle/platform-common.gradle')

// The integration test mod (sculktest): shared payloads and logic from
// platforms/shared, Forge glue from src/testmod. Always compiled, loaded in
// dev runs only with -Psculk.integ.
sourceSets {
    testmod {
        java.srcDirs = ['src/testmod/java', rootProject.file("platforms/shared/mc-${shared_mc}/testmod/java")]
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            // No Quick Play before 1.20: the older --server/--port launch arguments join on startup.
            if (sculkQuickPlay) programArguments.addAll('--server', sculkQuickPlay.split(':')[0], '--port', sculkQuickPlay.split(':')[1],
                    '--width', '640', '--height', '360')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
        }
        configureEach {
            sculkRunProperties.each { k, v -> systemProperty k, v }
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        if (sculkInteg) sculktest { sourceSet sourceSets.testmod }
    }
}

legacyForge.addModdingDependenciesTo(sourceSets.testmod)

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    if (sculkInteg) {
        // Integration test mods (Modrinth version ids), remapped from SRG to
        // dev names by MDG Legacy. See tests/integ/.
        modRuntimeOnly 'maven.modrinth:appleskin:YRzksfaH' // forge-mc1.19-2.4.2
        modRuntimeOnly 'maven.modrinth:balm:d7a0S3hj' // 4.6.0+forge-1.19.2
        modRuntimeOnly 'maven.modrinth:waystones:SybGnSuC' // 11.4.2+forge-1.19.2
    }
}

jar {
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [
        minecraft_version_range: minecraft_version_range,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_description        : mod_description,
    ]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata
