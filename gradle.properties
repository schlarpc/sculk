org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Toolchains: use only the JDKs the Nix dev shell provides (JAVA17_HOME etc.),
# never auto-detect or download. Outside Nix, export those variables yourself.
org.gradle.java.installations.fromEnv=JAVA17_HOME,JAVA21_HOME,JAVA25_HOME
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false

# Mod metadata
mod_id=sculk
mod_name=Sculk
mod_version=0.1.0
mod_license=MIT
mod_description=Scriptable protocol interception and injection for modded Minecraft.

# Build plugins
loom_version=1.19.4
moddev_version=2.0.148

# Shared libraries
rhino_version=1.9.2
